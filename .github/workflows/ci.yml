name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same class of failure as Vercel `next build` type-check
      - run: npm run typecheck

  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # prisma.config.ts requires DATABASE_URL even for generate (no real DB needed)
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
